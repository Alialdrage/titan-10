name: Crew service validation

on:
  push:
    branches:
      - main
      - fix/phase-1-foundation
    paths:
      - "services/crew/**"
      - "app/api/crew/**"
      - ".github/workflows/python-package-conda.yml"
  pull_request:
    branches:
      - main
    paths:
      - "services/crew/**"
      - "app/api/crew/**"
      - ".github/workflows/python-package-conda.yml"

jobs:
  crew-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Crew service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/crew/requirements.txt

      - name: Compile Crew service
        run: python -m py_compile services/crew/main.py

      - name: Run Crew service unit tests
        run: python -m unittest discover -s services/crew -p 'test_*.py' -v
